name: Nightly CI tests

on:
  schedule:
    - cron: "53 2 * * *" # Daily at 02:53 UTC
  workflow_dispatch:
  workflow_call:
    inputs:
      tfvars-file:
        description: "Optional artifact name containing tfvars for test runs"
        required: false
        type: string
        default: ""

jobs:
  checks:
    uses: ./.github/workflows/ci-checks.yaml

  integration-tests:
    name: "${{ matrix.tox-env }} (${{ matrix.k8s-distribution }}:${{ matrix.k8s-version }}): spark | ${{ matrix.storage-backend }} | ${{ matrix.cos-model }}"
    runs-on: ["self-hosted-linux-amd64-jammy-xlarge"]
    timeout-minutes: 120
    strategy:
      max-parallel: 15
      fail-fast: false
      matrix:
        tox-env:
          - integration-basic
          - integration-sparkjob
          - integration-kyuubi
          - integration-backup-restore
        storage-backend: ["s3", "azure_storage"]
        cos-model: ["cos"]
        juju-snap-channel: ["3.6/stable"]
        k8s-distribution: ["k8s", "microk8s"]
        k8s-version:
          - "1.28"
          - "1.30"
          - "1.32"
          - "1.34"
        unpinned: [""]
        exclude:
          - k8s-distribution: "k8s"
            k8s-version: "1.30"
          - k8s-distribution: "k8s"
            k8s-version: "1.28"
        include:
          # Test with unpinned revisions
          - tox-env: integration-bundle
            storage-backend: s3
            juju-snap-channel: "3.6/stable"
            k8s-distribution: "k8s"
            k8s-version: "1.32"
            unpinned: "--unpinned-revisions"

    needs:
      - checks
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run integration test
        uses: ./.github/actions/run-test
        with:
          k8s-distribution: ${{ matrix.k8s-distribution }}
          k8s-version: ${{ matrix.k8s-version }}
          tox-env: ${{ matrix.tox-env }}
          storage-backend: ${{ matrix.storage-backend || 's3'}}
          cos-model: ${{ matrix.cos-model }}
          juju-snap-channel: ${{ matrix.juju-snap-channel }}
          azure-storage-account: ${{ secrets.AZURE_STORAGE_ACCOUNT }}
          azure-storage-key: ${{ secrets.AZURE_STORAGE_KEY }}
          pytest-args: ${{ matrix.tox-env != 'integration-backup-restore' && '--keep-models' || '' }}
          tfvars-file: ${{ inputs.tfvars-file }}
          unpinned: ${{ matrix.unpinned }}

  aggregate-results:
    name: Aggregate Results
    runs-on: ubuntu-22.04
    needs: integration-tests
    if: ${{ success() || failure() }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: results
      - id: setup-python
        name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.12
          architecture: x64
      - name: Install pandas & tabulate
        run: |
          pip install pandas
          pip install tabulate
      - name: Run result aggregation script
        run: python3 .github/scripts/aggregate_results.py results/integration-results-*/test-result.json

      - name: Upload summary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: matrix-summary
          path: matrix-summary.md

      - name: Add to GitHub Summary
        run: cat matrix-summary.md >> $GITHUB_STEP_SUMMARY
