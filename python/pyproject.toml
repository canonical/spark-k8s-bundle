[tool.poetry]
name = "spark-k8s-test"
version = "0.0.5"
description = "This project provides some utilities function and CLI commands to test Charmed Spark on K8s."
authors = ["Canonical Processing team"]
urls = { contact = "https://matrix.to/#/%23charmhub-analytics%3Aubuntu.com" }
license = "Apache-2.0"
readme = "README.md"
packages = [{ include = "spark_test" }]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
spark8t = ">=1.4.0"
boto3 = ">=1.43.54"
pytest = "^9.1.1"
azure-storage-blob = "^12.30.0"
lightkube = ">=0.22.0"
impyla = "^0.24.0"

[tool.poetry.group.fmt]
optional = true

[tool.poetry.group.fmt.dependencies]
ruff = "^0.15.22"

[tool.poetry.group.lint]
optional = true

[tool.poetry.group.lint.dependencies]
codespell = "^2.4.3"
ruff = "^0.15.22"
mypy = ">=2.3.0"
pytest-mypy = ">=1.0.1"
types-psycopg2 = "^2.9.21.20250718"
types-pyyaml = "^6.0.12.20250516"
types-boto3 = { extras = ["s3"], version = "^1.43.54" }

[tool.poetry.group.unit]
optional = true

[tool.poetry.group.unit.dependencies]
pytest-cov = ">=7.1.0"
pytest-mock = ">=3.15.1"

[tool.poetry.group.integration]
optional = true

[tool.poetry.group.integration.dependencies]
pytest-cov = ">=7.1.0"
pytest-mock = ">=3.15.1"
psycopg2-binary = "^2.9.12"
tenacity = "^9.1.4"
httpx = "^0.28.1"
jubilant = "^1.11.0"
python-dotenv = "^1.2.2"
python-hcl2 = "^8.1.2"

[tool.poetry.group.benchmark]
optional = true

[tool.poetry.group.benchmark.dependencies]
great-tables = "^0.22.0"
polars = "^1.43.0"
pandas = "^2.3.3" # needed for great-tables' nanoplot

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
addopts = "--doctest-modules --cov=./spark_test"
log_cli_level = "INFO"
asyncio_mode = "auto"

[tool.ruff]
extend-exclude = ["__pycache__", "*.egg_info"]
target-version = "py310"
src = ["spark_test", "tests"]

[tool.ruff.lint]
select = ["B", "C", "D", "E", "F", "W", "B9", "I"]
ignore = ["E501", "D107", "F811"]
extend-ignore = [
  # Ignored by black
  "E203",
  "E266",
  "E501",
  # Ignored to conform to PEP257
  "D203",
  "D212",
  "D213",
  "D214",
  "D215",
  "D404",
  "D405",
  "D406",
  "D407",
  "D408",
  "D409",
  "D410",
  "D411",
  "D413",
  "D415",
  "D416",
  "D417",
]
per-file-ignores = { "__init__.py" = ["F401"], "tests/*" = ["D"], "tests/test_utils.py" = ["F601"] }
mccabe.max-complexity = 18

[tool.ruff.lint.isort]
known-first-party = ["spark_test", "tests"]

[tool.mypy]
follow_imports = "silent"

[[tool.mypy.overrides]]
module = [
  "impala.dbapi",
  "impala.hiveserver2",
  "pyspark.sql",
  "pyspark.sql.types",
]
ignore_missing_imports = true
